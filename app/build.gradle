import java.util.Properties

apply plugin: 'com.android.application'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def resolvedOpenCvSdk = localProperties.getProperty("opencvsdk") ?: project.findProperty("opencvsdk")
if (!resolvedOpenCvSdk) {
    throw new GradleException("Missing opencvsdk. Set it in local.properties or gradle.properties.")
}

def cimbarSenderHtmlSource = file("src/cpp/libcimbar/web/cimbar_js.html")
def cimbarSenderHtmlAsset = file("src/main/assets/cimbar_js.html")
def cimbarSenderBuildScript = file("src/cpp/libcimbar/build-sender-single.py")
def resolvedPythonExecutable = localProperties.getProperty("python") ?: project.findProperty("python") ?: "python"
def defaultDebugKeystore = new File(System.properties['user.home'], ".android/debug.keystore")
def resolvedReleaseStoreFile = localProperties.getProperty("releaseStoreFile")
        ?: project.findProperty("releaseStoreFile")
        ?: defaultDebugKeystore.absolutePath
def resolvedReleaseStorePassword = localProperties.getProperty("releaseStorePassword")
        ?: project.findProperty("releaseStorePassword")
        ?: "android"
def resolvedReleaseKeyAlias = localProperties.getProperty("releaseKeyAlias")
        ?: project.findProperty("releaseKeyAlias")
        ?: "androiddebugkey"
def resolvedReleaseKeyPassword = localProperties.getProperty("releaseKeyPassword")
        ?: project.findProperty("releaseKeyPassword")
        ?: "android"

android {
    compileSdkVersion 34
    ndkVersion "27.1.12297006"
    signingConfigs {
        releaseFallback {
            storeFile file(resolvedReleaseStoreFile)
            storePassword resolvedReleaseStorePassword
            keyAlias resolvedReleaseKeyAlias
            keyPassword resolvedReleaseKeyPassword
        }
    }
    defaultConfig {
        applicationId "org.cimbar.camerafilecopy"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 23
        versionName "0.6.4f"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                //arguments "-DCMAKE_BUILD_TYPE=Release"
                cppFlags "-frtti -fexceptions -std=c++17"
                abiFilters 'arm64-v8a'
                arguments "-DOpenCV_DIR=" + resolvedOpenCvSdk + "/sdk/native"
            }
        }
        setProperty("archivesBaseName", "CameraFileCopy")
    }
    buildTypes {
        release {
            signingConfig signingConfigs.releaseFallback
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation project(path: ':opencv')
}

tasks.register("syncCimbarSenderHtml") {
    dependsOn(tasks.named("generateCimbarSenderHtml"))

    inputs.file(cimbarSenderHtmlSource)
    outputs.file(cimbarSenderHtmlAsset)

    doLast {
        if (!cimbarSenderHtmlSource.exists()) {
            throw new GradleException("Missing generated sender HTML at " + cimbarSenderHtmlSource)
        }
        copy {
            from(cimbarSenderHtmlSource)
            into(cimbarSenderHtmlAsset.parentFile)
            rename { "cimbar_js.html" }
        }
    }
}

tasks.register("generateCimbarSenderHtml", Exec) {
    inputs.file(cimbarSenderBuildScript)
    inputs.file(file("src/cpp/libcimbar/package-cimbar-html.py"))
    inputs.file(file("src/cpp/libcimbar/CMakeLists.txt"))
    inputs.file(file("src/cpp/libcimbar/src/lib/cimbar_js/CMakeLists.txt"))
    inputs.files(fileTree("src/cpp/libcimbar/src"))
    inputs.files(fileTree("src/cpp/libcimbar/web") {
        include "index.html", "main.js", "cimbar_js.wasm"
    })
    outputs.file(cimbarSenderHtmlSource)

    workingDir rootProject.projectDir
    commandLine resolvedPythonExecutable, cimbarSenderBuildScript.absolutePath
}

preBuild.dependsOn(tasks.named("syncCimbarSenderHtml"))

preBuild.doFirst {
    if (!file(resolvedReleaseStoreFile).exists()) {
        throw new GradleException("Missing release signing keystore at " + resolvedReleaseStoreFile + ". Set releaseStoreFile in local.properties or ensure ~/.android/debug.keystore exists.")
    }
    if (!file(resolvedOpenCvSdk + "/sdk/native").exists()) {
        throw new GradleException("Missing OpenCV Android SDK. Set opencvsdk to the extracted OpenCV-android-sdk path.")
    }
    if (!file("src/main/assets").exists()) {
        throw new GradleException("Missing cimbar-js-bits submodule?")
    }
    if (!cimbarSenderBuildScript.exists()) {
        throw new GradleException("Missing sender build script at " + cimbarSenderBuildScript)
    }
}

